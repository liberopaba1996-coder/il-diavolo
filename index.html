<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Il diavolo non pu&ograve; raggiungermi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --nero:#050505;
    --osso:#cfc8bb;
    --cenere:#6b655b;
    --sangue:#9e1b1b;
    --sangue-scuro:#4a0d0d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--nero);color:var(--osso);
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:clamp(19px, 2.6vw, 24px);line-height:1.55;overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background:radial-gradient(ellipse at 50% 42%, rgba(20,14,12,0) 0%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.92) 100%);
    pointer-events:none;z-index:2;
  }
  #stage{
    position:relative;z-index:3;height:100%;
    max-width:680px;margin:0 auto;padding:8vh 28px 14vh;
    display:flex;flex-direction:column;justify-content:center;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #stage.top{justify-content:flex-start}
  p{margin-bottom:1.1em}
  .devil{font-style:italic;color:#b8aa96}
  .question{color:var(--osso)}
  .colpo{font-size:1.22em;line-height:1.45;color:#ddd5c6;font-style:italic}
  .small{font-size:.72em;color:var(--cenere);letter-spacing:.08em}
  .linkline{font-size:.7em;color:var(--cenere);word-break:break-all}
  .cursor{
    display:inline-block;width:.55em;height:2px;background:var(--sangue);
    margin-left:3px;vertical-align:baseline;animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  #title{
    position:fixed;inset:0;z-index:5;background:var(--nero);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;transition:opacity 1.6s ease;
  }
  #title.gone{opacity:0;pointer-events:none}
  #title h1{
    font-weight:400;font-size:clamp(26px,5.2vw,44px);
    letter-spacing:.14em;text-transform:uppercase;color:var(--osso);margin-bottom:.4em;
  }
  #title h1 span{color:var(--sangue)}
  #title .sub{font-style:italic;color:var(--cenere);margin-bottom:9vh;font-size:.85em}
  .btn{
    font-family:inherit;font-size:.85em;letter-spacing:.22em;text-transform:uppercase;
    background:none;color:var(--osso);border:1px solid var(--sangue-scuro);
    padding:16px 34px;cursor:pointer;transition:all .45s ease;
  }
  .btn:hover,.btn:focus-visible{
    border-color:var(--sangue);color:#fff;background:rgba(74,13,13,.18);outline:none;
  }
  .opts{display:flex;flex-direction:column;gap:14px;margin-top:1.6em;opacity:0;transition:opacity .8s ease}
  .opts.show{opacity:1}
  .opt{
    font-family:inherit;font-size:.9em;text-align:left;background:none;border:none;
    border-left:2px solid var(--sangue-scuro);color:var(--cenere);
    padding:10px 18px;cursor:pointer;transition:all .35s ease;
  }
  .opt:hover,.opt:focus-visible{color:var(--osso);border-left-color:var(--sangue);outline:none}
  .field{display:flex;gap:12px;margin-top:1.6em;opacity:0;transition:opacity .8s ease}
  .field.show{opacity:1}
  .field input{
    flex:1;font-family:inherit;font-size:1em;font-style:italic;
    background:none;border:none;border-bottom:1px solid var(--sangue-scuro);
    color:var(--osso);padding:8px 4px;
  }
  .field input:focus{outline:none;border-bottom-color:var(--sangue)}
  .codice{
    font-family:"Courier New", monospace;font-size:.58em;line-height:1.5;
    color:var(--sangue);background:rgba(74,13,13,.12);
    border:1px solid var(--sangue-scuro);padding:14px 16px;
    word-break:break-all;white-space:pre-wrap;letter-spacing:.04em;
    max-height:32vh;overflow-y:auto;
  }
  .copyrow{margin:-4px 0 18px}
  .testimone{
    font-style:italic;color:#ddd5c6;font-size:1.05em;line-height:1.6;
    border-left:2px solid var(--sangue);padding:6px 0 6px 18px;
  }
  .field .btn{padding:10px 20px;font-size:.7em}
  .skipline{margin-top:14px;text-align:left}
  .skipline button{
    background:none;border:none;cursor:pointer;font-family:inherit;font-style:italic;
    color:var(--cenere);font-size:.78em;
    text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--sangue-scuro);
  }
  .skipline button:hover{color:var(--osso)}
  #hint{
    position:fixed;bottom:18px;left:0;right:0;z-index:4;
    text-align:center;font-size:.62em;color:#3d3a34;
    letter-spacing:.1em;font-style:italic;pointer-events:none;transition:opacity 1s ease;
  }
  @media (prefers-reduced-motion: reduce){.cursor{animation:none}}
</style>
</head>
<body>

<div id="title">
  <h1>Il diavolo<br>non pu&ograve; <span>raggiungermi</span></h1>
  <div class="sub">un gioco onesto</div>
  <button class="btn" id="start">Parla col diavolo</button>
</div>

<div id="stage"></div>
<div id="hint">tocca lo schermo per far apparire subito il testo</div>

<script>
(function(){
  "use strict";

  var stage = document.getElementById("stage");
  var titleEl = document.getElementById("title");
  var hintEl = document.getElementById("hint");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var skipFlag = false;
  var typing = false;
  var A = {};
  var META = { skips:0, start:0, batt:null, charging:null, qs:[] };
  var SAVE_KEY = "diavolo_v1";

  document.addEventListener("pointerdown", function(){
    if(typing) META.skips++;
    skipFlag = true;
  });

  /* ---------- storage (works on the deployed site; silently off in previews) */
  function loadSave(){
    try{
      var s = localStorage.getItem(SAVE_KEY);
      return s ? JSON.parse(s) : null;
    }catch(e){ return null; }
  }
  function storeSave(){
    try{
      var prev = loadSave();
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        nome: A.nome, genere: A.genere, eta: A.eta,
        rimando: A.rimando, rimandoSub: A.rimandoSub || null,
        piace: A.piace, ts: Date.now(),
        visite: prev ? (prev.visite || 1) + 1 : 1
      }));
    }catch(e){}
  }

  /* ---------- shared-link name */
  function sharedName(){
    try{
      var q = new URLSearchParams(location.search).get("x");
      if(!q) return null;
      var n = decodeURIComponent(escape(atob(q)));
      n = n.replace(/[^A-Za-z\u00C0-\u017F' \-]/g, "").trim();
      return n ? cap(n.split(" ")[0]) : null;
    }catch(e){ return null; }
  }
  function makeShareLink(name){
    var enc = btoa(unescape(encodeURIComponent(name)));
    return location.origin + location.pathname + "?x=" + enc;
  }

  /* ---------- battery */
  try{
    if(navigator.getBattery){
      navigator.getBattery().then(function(b){
        META.batt = Math.round(b.level * 100);
        META.charging = b.charging;
      }).catch(function(){});
    }
  }catch(e){}

  /* ---------- helpers */
  function sleep(ms){
    if(reduced) ms = Math.min(ms, 120);
    return new Promise(function(res){
      var waited = 0, step = 50;
      var iv = setInterval(function(){
        waited += step;
        if(waited >= ms || skipFlag){ clearInterval(iv); res(); }
      }, step);
    });
  }
  function clearStage(){
    return new Promise(function(res){
      stage.style.transition = "opacity .7s ease";
      stage.style.opacity = "0";
      setTimeout(function(){
        stage.innerHTML = "";
        stage.classList.remove("top");
        stage.style.opacity = "1";
        res();
      }, reduced ? 60 : 720);
    });
  }
  function typeText(el, text){
    return new Promise(function(res){
      skipFlag = false; typing = true;
      var cur = document.createElement("span");
      cur.className = "cursor";
      el.appendChild(cur);
      var i = 0;
      function tick(){
        if(skipFlag || reduced){
          cur.remove();
          el.insertAdjacentText("beforeend", text.slice(i));
          skipFlag = false; typing = false; res(); return;
        }
        if(i >= text.length){ cur.remove(); typing = false; res(); return; }
        var ch = text[i];
        cur.insertAdjacentText("beforebegin", ch);
        i++;
        var d = 34 + Math.random()*46;
        if(",;:".indexOf(ch) >= 0) d += 220;
        if(".?!\u2026".indexOf(ch) >= 0) d += 420;
        if(Math.random() < 0.025) d += 320;
        setTimeout(tick, d);
      }
      tick();
    });
  }
  function addP(cls){
    var p = document.createElement("p");
    if(cls) p.className = cls;
    stage.appendChild(p);
    p.scrollIntoView({block:"end"});
    return p;
  }
  function say(text, cls){
    var p = addP(cls || "devil");
    return typeText(p, text).then(function(){ return sleep(900); });
  }
  function ask(text, options, track){
    var p = addP("question");
    return typeText(p, text).then(function(){
      return new Promise(function(res){
        var box = document.createElement("div");
        box.className = "opts";
        options.forEach(function(opt){
          var b = document.createElement("button");
          b.className = "opt";
          b.textContent = opt.label;
          b.addEventListener("click", function(e){
            e.stopPropagation();
            var ms = Date.now() - t0;
            if(track !== false) META.qs.push({ q: text, ms: ms });
            res({ value: opt.value, ms: ms });
          });
          box.appendChild(b);
        });
        stage.appendChild(box);
        box.scrollIntoView({block:"end"});
        requestAnimationFrame(function(){ box.classList.add("show"); });
        var t0 = Date.now();
      });
    });
  }
  function askText(text, placeholder, allowSkip, skipLabel, maxLen){
    var p = addP("question");
    return typeText(p, text).then(function(){
      return new Promise(function(res){
        var wrap = document.createElement("div");
        wrap.className = "field";
        var input = document.createElement("input");
        input.type = "text"; input.maxLength = maxLen || 120; input.autocomplete = "off";
        input.placeholder = placeholder || "";
        var btn = document.createElement("button");
        btn.className = "btn"; btn.textContent = "Invia";
        wrap.appendChild(input); wrap.appendChild(btn);
        stage.appendChild(wrap);
        var skipBtn = null;
        if(allowSkip){
          var sl = document.createElement("div");
          sl.className = "skipline";
          skipBtn = document.createElement("button");
          skipBtn.textContent = skipLabel || "Non te lo dico.";
          sl.appendChild(skipBtn);
          stage.appendChild(sl);
        }
        wrap.scrollIntoView({block:"end"});
        requestAnimationFrame(function(){ wrap.classList.add("show"); });
        var t0 = Date.now();
        function send(){
          var v = input.value.trim();
          if(!v){ input.focus(); return; }
          res({ value:v, skipped:false, ms: Date.now() - t0 });
        }
        btn.addEventListener("click", function(e){ e.stopPropagation(); send(); });
        input.addEventListener("keydown", function(e){
          if(e.key === "Enter") send();
          e.stopPropagation();
        });
        input.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
        if(skipBtn){
          skipBtn.addEventListener("click", function(e){
            e.stopPropagation();
            res({ value:null, skipped:true, ms: Date.now() - t0 });
          });
        }
        setTimeout(function(){ input.focus(); }, 150);
      });
    });
  }
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function secs(ms){ return Math.max(1, Math.round(ms/1000)); }
  function secWord(n){ return n === 1 ? "secondo" : "secondi"; }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function shuffle(a){
    for(var z=a.length-1;z>0;z--){
      var j = Math.floor(Math.random()*(z+1));
      var t = a[z]; a[z] = a[j]; a[j] = t;
    }
    return a;
  }
  function sleepHard(ms){
    return new Promise(function(res){ setTimeout(res, reduced ? 200 : ms); });
  }
  function g(m, f){ return A.genere === "f" ? f : m; }

  // keyword engine for open questions
  function kwMatch(text, families){
    var low = " " + text.toLowerCase().replace(/[.,;:!?\u2019']/g," ") + " ";
    for(var i=0;i<families.length;i++){
      var f = families[i];
      for(var j=0;j<f.stems.length;j++){
        var s = f.stems[j];
        if(f.exact){
          if(low.indexOf(" " + s + " ") >= 0) return f.key;
        } else {
          if(low.indexOf(s) >= 0) return f.key;
        }
      }
    }
    return null;
  }
  function findName(text){
    // a capitalized word that is not at the start of the sentence
    var words = text.trim().split(/\s+/);
    for(var i=0;i<words.length;i++){
      var w = words[i].replace(/[^A-Za-z\u00C0-\u017F]/g,"");
      if(w.length >= 3 && /^[A-Z\u00C0-\u00DC]/.test(w) && (i > 0 || words.length === 1)){
        return cap(w.toLowerCase());
      }
    }
    return null;
  }
  function wordCount(text){
    return text.trim().split(/\s+/).filter(Boolean).length;
  }

  /* ------------------------------------------------------------------ */
  /*  ENTRY: returning player / shared link / new player                 */
  /* ------------------------------------------------------------------ */

  async function entry(){
    META.start = Date.now();
    await clearStage();
    await sleep(600);

    var shared = sharedName();
    var save = loadSave();

    if(shared){
      A.nome = shared;
      await say(pick([
        "Buonasera, " + A.nome + ".",
        A.nome + ". Ti stavo aspettando."
      ]));
      await say("No, non chiederti come faccio a sapere il tuo nome. Qualcuno che ti conosce bene mi ha aperto la porta. Pensaci, dopo: chi \u00e8 stato? E perch\u00e9 ha pensato proprio a te?");
      await askPerche();
      await askGenere();
      await askEta();
      await game();
      return;
    }

    if(save && save.nome){
      A.nome = save.nome;
      A.genere = save.genere || "m";
      var giorni = Math.floor((Date.now() - save.ts) / 86400000);
      var r = await ask("Bentornat" + g("o","a") + ", " + A.nome + ". Sei ancora tu?", [
        {label:"S\u00ec", value:true},
        {label:"No", value:false}
      ], false);
      if(!r.value){
        await say("Allora ricominciamo da capo. Ma riferisci a " + save.nome + " che il conto resta aperto.");
        A = {};
        await clearStage();
        await say(pick([
          "Hai bussato tu. Ricordalo, quando sar\u00e0 finita.",
          "Entra pure. Tanto eri gi\u00e0 dentro."
        ]));
        await askPerche();
        await askNome();
        await askGenere();
        await askEta();
        await game();
        return;
      }
      if(giorni >= 6 && giorni <= 9){
        A.eta = save.eta || 30;
        A.notti = Math.round(A.eta * 365.25);
        await say("Sette giorni. Te l\u2019avevo chiesto io, e sei venut" + g("o","a") + ". Puntuale con me. Vediamo con il resto.");
        r = await ask("Una domanda sola: \u00e8 cambiato qualcosa?", [
          {label:"S\u00ec", value:"si"},
          {label:"No", value:"no"},
          {label:"Sto provando", value:"provo"}
        ], false);
        if(r.value === "si"){
          await say("Vedremo. Rispondi alle mie domande e lo scopriamo insieme.");
        } else if(r.value === "no"){
          await say("Sette giorni, zero movimenti. Almeno con me sei puntuale. Con te continui a dare buca.");
        } else {
          await say("\u201cSto provando\u201d \u00e8 gi\u00e0 pi\u00f9 di quanto mi aspettassi. Non ti abituare: era l\u2019ultimo complimento.");
        }
        await game();
        return;
      }

      if(giorni < 1){
        await say("Sei gi\u00e0 qui. Non \u00e8 passato nemmeno un giorno. Ti manco, o l\u00e0 fuori non ti ascolta nessuno?");
      } else {
        await say(giorni === 1 ? "\u00c8 passato un giorno." : "Sono passati " + giorni + " giorni. Li ho contati.");
      }
      A.eta = save.eta || 30;
      A.notti = Math.round(A.eta * 365.25);
      if(save.rimando){
        var cosa =
          save.rimando === "conversazione" ? "Quella conversazione che rimandavi" :
          save.rimando === "decisione"     ? "Quella decisione che rimandavi" :
          save.rimando === "cura"          ? "Quel prenderti cura di te che rimandavi" :
                                             "Quel sogno che tenevi nel cassetto";
        await clearStage();
        r = await ask(cosa + "... ci hai fatto qualcosa, nel frattempo?", [
          {label:"S\u00ec", value:"si"},
          {label:"No", value:"no"},
          {label:"Ci sto lavorando", value:"lavorando"}
        ], false);
        if(r.value === "si"){
          await say("Bene. Non ci credo, ma bene. Vediamo cosa hai trovato per sostituirl" + (save.rimando === "sogno" ? "o" : "a") + ".");
        } else if(r.value === "no"){
          await say("Lo sapevo. Il tempo passa anche quando non scegli, " + A.nome + ". Anzi: soprattutto quando non scegli.");
        } else {
          await say("\u201cCi sto lavorando.\u201d La frase con cui si rimanda perfino la resa dei conti. Ricominciamo, va.");
        }
      }
      await game();
      return;
    }

    // brand new player
    await say(pick([
      "Hai bussato tu. Ricordalo, quando sar\u00e0 finita.",
      "Entra pure. Tanto eri gi\u00e0 dentro.",
      "Siediti. Questa conversazione la rimandi da molto pi\u00f9 tempo di quanto credi."
    ]));
    await sleep(400);
    await askPerche();
    await askNome();
    await askGenere();
    await askEta();
    await game();
  }

  async function askNome(){
    var r = await askText("Come ti chiami?", "il tuo nome", false);
    A.nome = cap(r.value.split(" ")[0]);
    await clearStage();
    await say(pick([
      A.nome + ". Bene. Mi piace sapere chi ho davanti. Anche se ti conosco gi\u00e0 da prima che entrassi.",
      A.nome + ". Lo pronuncer\u00f2 spesso, stanotte. Abituati."
    ]));
  }

  async function askGenere(){
    await clearStage();
    var r = await ask("Uomo o donna? Le anime mi arrivano tutte uguali, devo chiedere.", [
      {label:"Uomo", value:"m"},
      {label:"Donna", value:"f"},
      {label:"Indovina", value:"x"}
    ], false);
    if(r.value === "x"){
      A.genere = "m";
      await say("Allora user\u00f2 il maschile, come fa la tua lingua da secoli. Prenditela con lei, non con me.");
    } else {
      A.genere = r.value;
    }
  }

  async function askEta(){
    await clearStage();
    var r = await askText("Quanti anni hai, " + A.nome + "?", "un numero", false);
    var age = parseInt(r.value.replace(/\D/g,""), 10);
    if(isNaN(age) || age < 5 || age > 110) age = 30;
    A.eta = age;
    A.notti = Math.round(age * 365.25);
    await clearStage();
    await say(pick([
      A.eta + " anni. Annotato. I numeri non mentono mai. Tu invece vediamo.",
      A.eta + ". Me lo segno. I numeri torneranno, e non saranno gentili."
    ]));
  }

  async function askPerche(){
    await clearStage();
    var r = await ask("Prima di tutto: perch\u00e9 sei qui?", [
      {label:"Curiosit\u00e0", value:"curiosita"},
      {label:"Noia", value:"noia"},
      {label:"Voglio vedere se mi conosci", value:"conosci"},
      {label:"Non lo so", value:"boh"}
    ]);
    A.perche = r.value;
    if(A.perche === "curiosita"){
      await say("La curiosit\u00e0. La scusa di chi spera di sentirsi dire qualcosa di vero.");
    } else if(A.perche === "noia"){
      await say("La noia non esiste. \u00c8 dolore a basso volume. Alziamolo un po\u2019, allora.");
    } else if(A.perche === "conosci"){
      await say("Sfida accettata. Solo un dettaglio: per scoprire se ti conosco, dovrai ammettere ogni volta che ho ragione.");
    } else {
      await say("Non lo sai. Tranquill" + g("o","a") + ": alla fine lo saprai. \u00c8 incluso nel prezzo.");
    }
  }

  /* ---------- rotating pool questions ---------- */

  async function qNumero(){
    await clearStage();
    var r = await ask("Scegli un numero. Non chiederti perch\u00e9.", [
      {label:"3", value:3},{label:"7", value:7},{label:"9", value:9},{label:"13", value:13}
    ]);
    A.numero = r.value;
    if(A.numero === 13){
      await say("Tredici. Nessuno sceglie il tredici per caso. Tu volevi sembrare " + g("uno che non ha","una che non ha") + " paura.");
    } else if(A.numero === 7){
      await say("Il sette. Il numero di chi vuole sembrare normale.");
    } else if(A.numero === 3){
      await say("Il tre. Hai scelto in fretta, come al solito: pur di togliertelo di torno.");
    } else {
      await say("Il nove. Quasi dieci. Quasi. Ci torneremo.");
    }
  }

  async function qPorta(){
    await clearStage();
    var r = await ask("Davanti a te ci sono due porte identiche. Scegline una.", [
      {label:"Quella a sinistra", value:"sinistra"},
      {label:"Quella a destra", value:"destra"}
    ]);
    A.porta = r.value;
    await say("Aperta. Dentro non c\u2019era niente. Come nell\u2019altra. Ma tu dovevi scegliere lo stesso, vero? Ci torneremo anche su questo.");
  }

  async function qNotte(){
    await clearStage();
    var r = await ask("Di notte, prima di dormire, a cosa pensi pi\u00f9 spesso?", [
      {label:"A cose che ho detto", value:"detto"},
      {label:"A cose che non ho detto", value:"nondetto"},
      {label:"A cose che dovrei fare", value:"fare"},
      {label:"A niente. Scorro il telefono.", value:"telefono"}
    ]);
    A.notte = r.value;
    if(A.notte === "telefono"){

  async function game(){

    // ---- relationship status
    await clearStage();
    var r = await ask("C\u2019\u00e8 qualcuno accanto a te, nella vita?", [
      {label:"No, sono single", value:"single"},
      {label:"S\u00ec, sono in coppia", value:"coppia"},

    ]);

    if(A.relazione === "complicato"){
      await say("\u201cComplicato.\u201d Annotato. Ci torno dopo, su questa parola. Le voglio bene, a questa parola.");
    } else if(A.relazione === "finita"){
      await say("Da poco. Si sente. Hai il passo di chi cammina ancora contando i giorni.");
    }

    // ---- rotating pool: 3 heavy + 1 open + 1 nonsense, in random order
    var heavyQ = shuffle([qNotte, qPersona, qTreNotte, qSoloAltri, qPaura, qAmore, qBugia, qPianto, qAiuto, qPentimento, qSparire, qMessaggio]).slice(0,3);
    var openQ  = shuffle([qParola, qDeluso, qScuse]).slice(0,1);
    var nonsQ  = shuffle([qNumero, qPorta]).slice(0,1);
    var poolQ  = shuffle(heavyQ.concat(openQ, nonsQ));
    for(var pi=0; pi<poolQ.length; pi++){
      await poolQ[pi]();
    }


    // ---- what you postpone + branch
    await clearStage();
    r = await ask("Cosa stai rimandando da pi\u00f9 tempo?", [
      {label:"Una conversazione", value:"conversazione"},
      {label:"Una decisione", value:"decisione"},
      {label:"Prendermi cura di me", value:"cura"},
      {label:"Un sogno che tengo nel cassetto", value:"sogno"}
    ]);
    A.rimando = r.value;
    await say(pick([
      "Ecco. Adesso s\u00ec che parliamo.",
      "Ecco la porta che cercavo.",
      "Finalmente. Il resto era contorno."
    ]));
    await clearStage();

    if(A.rimando === "conversazione"){
      r = await ask("Con chi?", [
        {label:"Un familiare", value:"familiare"},
        {label:"Un amore. Passato o presente.", value:"amore"},
        {label:"Un amico", value:"amico"},
        {label:"Con me stess" + g("o","a"), value:"mestesso"}
      ]);

      if(A.rimandoSub === "mestesso"){
        await say("Con te stess" + g("o","a") + ". La pi\u00f9 rimandata di tutte. Sei un creditore molto paziente, " + A.nome + ". Troppo.");

    } else if(A.rimando === "decisione"){
      r = await ask("E questa decisione riguarda...", [
        {label:"Il lavoro", value:"lavoro"},
        {label:"Una persona", value:"personadec"},
        {label:"Tutta la mia vita", value:"vita"}
      ]);
      A.rimandoSub = r.value;
      if(A.rimandoSub === "vita"){
        await say("\u201cTutta la mia vita.\u201d Pi\u00f9 \u00e8 grande la decisione, pi\u00f9 \u00e8 elegante la scusa per non prenderla.");
      }
    } else if(A.rimando === "cura"){
      r = await ask("Cosa stai trascurando, esattamente?", [
        {label:"Il corpo", value:"corpo"},
        {label:"La testa", value:"testa"},
        {label:"Il sonno", value:"sonno"},
        {label:"Tutto insieme", value:"tuttocura"}
      ]);
      A.rimandoSub = r.value;
    } else {
      r = await ask("Da quanto tempo \u00e8 nel cassetto, quel sogno?", [
        {label:"Meno di un anno", value:"poco"},
        {label:"Qualche anno", value:"anni"},
        {label:"Da sempre", value:"sempre"}
      ]);
      A.rimandoSub = r.value;

    var pf = addP("question");
    await typeText(pf, "Sei felice?");

    pf.appendChild(curf);
    await sleepHard(5000);
    curf.remove();
    await say("Non c\u2019\u00e8 un bottone per questa. Volevo solo vedere quanto aspettavi che comparisse.");

    await clearStage();
    r = await ask("Ti piace la persona che sei diventat" + g("o","a") + "?", [
      {label:"S\u00ec", value:"si"},
      {label:"No", value:"no"},
      {label:"Non lo so", value:"boh"}
    ]);
    A.piace = r.value;
    A.piaceMs = r.ms;
    if(A.piace === "no" || A.piace === "boh"){
      if(A.piace === "boh"){
        await say("\u201cNon lo so\u201d \u00e8 la risposta di chi lo sa benissimo.");

        await say("Almeno sei onest" + g("o","a") + ". \u00c8 pi\u00f9 di quanto tu faccia di solito.");
      }
      await clearStage();
      r = await ask("Quando hai smesso di piacerti?", [
        {label:"Lo so esattamente", value:"esatto"},
        {label:"Non me ne sono accort" + g("o","a"), value:"accorto"},

      {label:"Qualcosa. E so cosa.", value:"qualcosa"},
      {label:"Niente", value:"niente"}
    ]);

      {label:"Sto vivendo", value:"vivendo"},
      {label:"Sto sopravvivendo", value:"sopra"},
      {label:"Non conosco pi\u00f9 la differenza", value:"boh"}
    ]);
    A.vita = r.value;
    A.vitaMs = r.ms;
    if(A.vita === "sopra"){
      await say("Eccola. La risposta che aspettavo da quando hai bussato.");
    } else if(A.vita === "boh"){
      await say("\u201cNon conosco pi\u00f9 la differenza.\u201d \u00c8 la frase pi\u00f9 onesta della serata. Ed \u00e8 anche la pi\u00f9 grave.");
    } else if(r.ms > 2500){
      await say("\u201cSto vivendo.\u201d Dopo " + secs(r.ms) + " " + secWord(secs(r.ms)) + " di silenzio. Le vite vere rispondono prima.");
    }

    // ---- FINAL QUESTION
    await clearStage();
    await sleep(700);
    await say("Un\u2019ultima cosa, " + A.nome + ".");
    r = await ask("Vuoi sapere come ti ho raggiunt" + g("o","a") + "?", [
      {label:"S\u00ec", value:true},
      {label:"No", value:false}
    ], false);

    storeSave();

    if(!r.value){
      await clearStage();
      await say(g("Saggio.","Saggia."));
      await say("Ma non cambia niente: non serve che te lo dica io. Lo sai gi\u00e0. \u00c8 per questo che hai premuto \u201cno\u201d.");
      await sleep(800);
      await endScreen("Il gioco \u00e8 finito. Io no.");
      return;
    }

    await oracoloRaccolta();
    await finalReveal();
  }

  function b64try(s){
    var d = b64dec(s);
    if(d) return d;
    if(s.length % 4 !== 0){

      if(d) return d;
      d = b64dec(s.slice(0, s.length - (s.length % 4)));
      if(d) return d;
    }
    return null;
  }

  function oracoloValuta(dec){
    if(!dec) return null;
    var sep = dec.indexOf("|");
    var rawParola = (sep >= 0 ? dec.slice(0, sep) : dec).toUpperCase().replace(/[^A-Z]/g,"");
    var testo = sep >= 0 ? dec.slice(sep + 1).replace(/\s+/g," ").trim().slice(0, 700) : "";
    if(testo.length < 40) testo = "";
    if(rawParola === "IGNOTO") return { parola:"IGNOTO", testo:"" };
    if(ORACOLO_PAROLE.indexOf(rawParola) >= 0) return { parola:rawParola, testo:testo };
    if(testo) return { parola:null, testo:testo };
    return null;
  }

  function parseOracolo(t){
    if(!t) return null;
    var up = t.toUpperCase();
    var idx = t.indexOf("666");
    if(idx >= 0){
      var rest = t.slice(idx + 3).replace(/^[\s\-:*_`]+/, "");
      var stop = rest.search(/[^A-Za-z0-9+\/=\s]/);
      var zone = stop < 0 ? rest : rest.slice(0, stop);
      var segs = zone.split(/\s+/).filter(Boolean);
      for(var n = segs.length; n >= 1; n--){
        var esito = oracoloValuta(b64try(segs.slice(0, n).join("")));
        if(esito) return esito;
      }
    }
    if(up.indexOf("IGNOTO") >= 0) return { parola:"IGNOTO", testo:"" };
    for(var i=0;i<ORACOLO_PAROLE.length;i++){
      if(up.indexOf(ORACOLO_PAROLE[i]) >= 0) return { parola:ORACOLO_PAROLE[i], testo:"" };
    }
    return null;
  }

    await say(pick([
      "E ora la cosa pi\u00f9 crudele che posso dirti. \u00c8 anche l\u2019unica vera: la porta si chiude solo dall\u2019interno. Lo hai sempre saputo. \u00c8 per questo che fa male. E finch\u00e9 resta aperta, " + A.nome + ", io non ho nemmeno bisogno di entrare: mi basta che tu sappia che potrei.",
      "Chiudo con l\u2019unica crudelt\u00e0 che mi \u00e8 concessa, perch\u00e9 \u00e8 la verit\u00e0: la porta si chiude solo dall\u2019interno, " + A.nome + ". La maniglia \u00e8 dalla tua parte. \u00c8 sempre stata dalla tua parte. Ed \u00e8 esattamente questo che non mi preoccupa.",
      "E non cercarmi alle tue spalle, " + A.nome + ": l\u00ec non ci sono mai stato. Sono seduto al volante da un pezzo, e tu guardi il paesaggio. Se vuoi tornare a guidare, la maniglia \u00e8 dalla tua parte. \u00c8 sempre stata l\u00ec. Sei tu che hai smesso di guardarla.",
      "Ultima cosa, " + A.nome + ". Tra poco chiuderai questa pagina, e lo schermo diventer\u00e0 nero. Guarda bene cosa ci appare riflesso, in quel nero. Io lavoro l\u00ec. Ma guardala bene tutta, quella faccia: c\u2019\u00e8 anche la maniglia della porta, dalla stessa parte. C\u2019\u00e8 sempre stata. Stasera scegli tu chi dei due comanda."
    ]));
    await sleep(500);

    await say("Torna tra sette giorni, " + A.nome + ". Una domanda sola. Vedi di avere una risposta.", "small");
    await sleep(1000);
    await endScreen("Il gioco \u00e8 finito. Io no.");
  }

  /* ------------------------------------------------------------------ */
  /*  END SCREEN + SHARE                                                 */
  /* ------------------------------------------------------------------ */

  async function endScreen(lastLine){
    var p = addP("devil small");
    await typeText(p, lastLine);
    await sleep(600);

    var box = document.createElement("div");
    box.className = "opts show";

    var b2 = document.createElement("button");
    b2.className = "opt";
    b2.textContent = "Manda il diavolo a qualcuno";
    b2.addEventListener("click", function(e){
      e.stopPropagation();
      box.remove();
      shareFlow();
    });
    box.appendChild(b2);

    var b1 = document.createElement("button");
    b1.className = "opt";
    b1.textContent = "Chiudi la porta";
    b1.addEventListener("click", function(e){
      e.stopPropagation();
      location.reload();
    });
    box.appendChild(b1);

    stage.appendChild(box);
    box.scrollIntoView({block:"end"});
    hintEl.style.opacity = "0";
  }

  async function shareFlow(){
    var r = await askText("A chi vuoi mandarmi? Scrivi il suo nome. Solo il nome.", "il nome", false);
    var friend = cap(r.value.split(" ")[0]);
    var link = makeShareLink(friend);
    var copied = false;
    try{
      if(navigator.share){
        await navigator.share({ title: "Il diavolo non pu\u00f2 raggiungermi", url: link });
        copied = true;
      }
    }catch(e){}
    if(!copied){
      try{
        await navigator.clipboard.writeText(link);
        copied = true;
      }catch(e){}
    }
    if(copied){
      await say("Fatto. " + friend + " ricever\u00e0 il mio saluto, per nome, senza che nessuno glielo abbia chiesto. Mandaglielo senza spiegare niente: funziona meglio cos\u00ec.");
    } else {
      await say("Ecco il collegamento. Copialo e mandaglielo senza spiegare niente: funziona meglio cos\u00ec.");
    }
    var lp = addP("linkline");
    lp.textContent = link;
    await endScreen("Quando lo aprir\u00e0, sapr\u00f2 gi\u00e0 come si chiama.");
  }

  document.getElementById("start").addEventListener("click", function(e){
    e.stopPropagation();
    titleEl.classList.add("gone");
    setTimeout(entry, reduced ? 100 : 1400);
  });

})();
</script>
